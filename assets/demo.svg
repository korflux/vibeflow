<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">vibeflow demo</title>
  <desc id="d">Illustration of a high-route phase: the lead announces the route, runs interview, spec, plan, analyze, implement, checkpoint and review, and asks the human before pushing.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="14" fill="#0b1020"/>
  <rect width="960" height="48" rx="14" fill="#151a36"/>
  <rect y="34" width="960" height="14" fill="#151a36"/>
  <circle cx="28" cy="24" r="6.5" fill="#f87171"/>
  <circle cx="50" cy="24" r="6.5" fill="#fbbf24"/>
  <circle cx="72" cy="24" r="6.5" fill="#34d399"/>
  <text x="480" y="29" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">vibeflow</text>
  <g font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="16.5">
    <text x="36" y="104" opacity="1"><tspan fill="#f0abfc" xml:space="preserve">❯ </tspan><tspan fill="#e2e8f0" xml:space="preserve">/vibeflow agendamento online com pagamento</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0273;0.9650"/></text>
    <text x="36" y="135" opacity="1"><tspan fill="#64748b" xml:space="preserve">rota: </tspan><tspan fill="#f0abfc" xml:space="preserve">high</tspan><tspan fill="#64748b" xml:space="preserve"> · risco: </tspan><tspan fill="#fcd34d" xml:space="preserve">pagamento</tspan><tspan fill="#64748b" xml:space="preserve"> · alvo: </tspan><tspan fill="#7dd3fc" xml:space="preserve">.vibeflow/phases/phase-3-agenda-online/</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1000;0.9650"/></text>
    <text x="36" y="166" opacity="1"><tspan fill="#64748b" xml:space="preserve">etapas: interview → spec → plan → analyze → implement → review</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1364;0.9650"/></text>
    <text x="36" y="197" opacity="1"><tspan fill="#86efac" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">interview   </tspan><tspan fill="#64748b" xml:space="preserve">uma pergunta por vez, com recomendação</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2000;0.9650"/></text>
    <text x="36" y="228" opacity="1"><tspan fill="#86efac" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">spec        </tspan><tspan fill="#7dd3fc" xml:space="preserve">aprovada por você</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2727;0.9650"/></text>
    <text x="924" y="228" text-anchor="end" fill="#64748b" opacity="1">progresso: 5%<animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2727;0.9650"/></text>
    <text x="36" y="259" opacity="1"><tspan fill="#86efac" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">plan        </tspan><tspan fill="#64748b" xml:space="preserve">6 passos, 1 checkpoint</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3455;0.9650"/></text>
    <text x="924" y="259" text-anchor="end" fill="#64748b" opacity="1">progresso: 10%<animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3455;0.9650"/></text>
    <text x="36" y="290" opacity="1"><tspan fill="#86efac" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">analyze     </tspan><tspan fill="#64748b" xml:space="preserve">revisor em contexto limpo: nenhum achado</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4182;0.9650"/></text>
    <text x="924" y="290" text-anchor="end" fill="#64748b" opacity="1">progresso: 15%<animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4182;0.9650"/></text>
    <text x="36" y="321" opacity="1"><tspan fill="#c4b5fd" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">implement   </tspan><tspan fill="#64748b" xml:space="preserve">passos 3/6, um commit por passo</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5000;0.9650"/></text>
    <text x="924" y="321" text-anchor="end" fill="#64748b" opacity="1">progresso: 41%<animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5000;0.9650"/></text>
    <text x="36" y="352" opacity="1"><tspan fill="#c4b5fd" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">checkpoint  </tspan><tspan fill="#64748b" xml:space="preserve">verificador: A1 e A2 verdes, com evidência</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5818;0.9650"/></text>
    <text x="36" y="383" opacity="1"><tspan fill="#86efac" xml:space="preserve">● </tspan><tspan fill="#e2e8f0" xml:space="preserve">review      </tspan><tspan fill="#64748b" xml:space="preserve">regressão verde · Approve proposto</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6636;0.9650"/></text>
    <text x="924" y="383" text-anchor="end" fill="#64748b" opacity="1">progresso: 85%<animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6636;0.9650"/></text>
    <text x="36" y="414" opacity="1"><tspan fill="#fcd34d" xml:space="preserve">? </tspan><tspan fill="#e2e8f0" xml:space="preserve">Aprovar a review e fazer push?</tspan><tspan fill="#7dd3fc" xml:space="preserve">  sim</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7455;0.9650"/></text>
    <text x="36" y="445" opacity="1"><tspan fill="#86efac" xml:space="preserve">✓ </tspan><tspan fill="#86efac" xml:space="preserve">phase fechada · push feito</tspan><animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8091;0.9650"/></text>
    <text x="924" y="445" text-anchor="end" fill="#64748b" opacity="1">progresso: 100%<animate attributeName="opacity" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8091;0.9650"/></text>
  </g>
  <rect x="36" y="492" width="888" height="8" rx="4" fill="#1e293b"/>
  <rect x="36" y="492" width="0" height="8" rx="4" fill="url(#bar)">
    <animate attributeName="width" dur="22s" repeatCount="indefinite" calcMode="discrete" values="0.0;44.4;88.8;133.2;364.1;754.8;888.0;0" keyTimes="0.0000;0.2727;0.3455;0.4182;0.5000;0.6636;0.8091;0.9650"/>
  </rect>
</svg>
