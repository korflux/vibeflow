<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">vibeflow</title>
  <desc id="d">vibeflow: one skill, one lead agent, from request to push. Stages: request, spec, plan, implement, review, push.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#131a35"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="80" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#ink)">vibeflow</text>
  <text x="84" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#e2e8f0">One skill. One lead agent. From request to push.</text>

  <!-- Flow -->
  <g font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" text-anchor="middle">
    <path d="M150 284H1130" stroke="url(#ink)" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="2 8" stroke-linecap="round"/>
    <g>
      <rect x="80" y="262" width="140" height="44" rx="22" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.7"/>
      <text x="150" y="290" fill="#bae6fd">request</text>
    </g>
    <g>
      <rect x="262" y="262" width="140" height="44" rx="22" fill="#0f172a" stroke="#93c5fd" stroke-opacity="0.7"/>
      <text x="332" y="290" fill="#bfdbfe">spec</text>
    </g>
    <g>
      <rect x="444" y="262" width="140" height="44" rx="22" fill="#0f172a" stroke="#a5b4fc" stroke-opacity="0.7"/>
      <text x="514" y="290" fill="#c7d2fe">plan</text>
    </g>
    <g>
      <rect x="626" y="262" width="160" height="44" rx="22" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="706" y="290" fill="#ddd6fe">implement</text>
    </g>
    <g>
      <rect x="828" y="262" width="140" height="44" rx="22" fill="#0f172a" stroke="#c4b5fd" stroke-opacity="0.7"/>
      <text x="898" y="290" fill="#e9d5ff">review</text>
    </g>
    <g>
      <rect x="1010" y="262" width="140" height="44" rx="22" fill="#0f172a" stroke="#f0abfc" stroke-opacity="0.7"/>
      <text x="1080" y="290" fill="#f5d0fe">push</text>
    </g>
  </g>

  <!-- Hosts -->
  <text x="1200" y="78" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">Claude Code · Codex · Grok Build</text>
  <text x="1200" y="102" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">Antigravity · OpenCode · Pi</text>
</svg>
